name: تحديث بيانات المنافسين اليومي

on:
  schedule:
    # 3:00 صباحًا بتوقيت UTC = 6:00 صباحًا بتوقيت السعودية
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي فوري من تبويب Actions بالمستودع

permissions:
  contents: write   # مطلوب عشان الخطوة الأخيرة تقدر تحفظ (Commit) النتائج

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: pip install -r scripts/requirements.txt

      - name: تشغيل سكربت الزحف
        run: python scripts/scraper.py

      - name: حفظ النتائج بالمستودع (Commit)
        run: |
          git config user.name "techtime-bot"
          git config user.email "bot@techtimesa.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "تحديث بيانات المنافسين — $(date +'%Y-%m-%d')"
          git push
